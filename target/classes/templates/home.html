<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Senhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<div class="container d-flex align-items-center justify-content-center py-5">

    <div class="mx-auto text-center" style="max-width: 600px; width: 100%;">

        <div class="mb-4 fade-in">
            <h1 class="display-4 fw-bold">Painel de Senhas</h1>
            <p class="lead subtitle">
                Sistema de gerenciamento e chamada de senhas
            </p>
        </div>

        <div class="card p-4 p-md-5 fade-in">

            <div class="mb-4">
                <h3>Bem-vindo</h3>
                <p class="mb-0">
                    Selecione o painel que deseja acessar.
                </p>
            </div>

            <div class="d-flex flex-column gap-3 mt-4">

                <a class="btn btn-success btn-lg"
                   th:href="@{/atendente}">
                    Painel do Atendente
                </a>

                <a class="btn btn-outline-danger btn-lg"
                   th:href="@{/display}">
                    Painel de Chamada (Display)
                </a>

            </div>

        </div>
    </div>

</div>
</body>
</html>
