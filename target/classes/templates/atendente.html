<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de Controle - Geração de Senhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<div class="container d-flex align-items-center justify-content-center py-5">

    <div class="card mx-auto text-center p-4 p-md-5 fade-in"
         style="max-width: 500px; width: 100%;">

        <h3>Painel do Atendente</h3>

        <p class="subtitle">
            Controle de geração de senhas
        </p>

        <div class="senha-display">
            <span class="section-title d-block">Senha atual</span>

            <h1 th:text="${currentDisplay}">
                0
            </h1>
        </div>

        <form th:action="@{/atendente/gerar}" method="post">

            <button type="submit"
                    class="btn btn-success btn-lg w-100">
                Gerar Nova Senha
            </button>

        </form>

        <hr>

        <a class="btn btn-link"
           th:href="@{/display}">
            Abrir Painel do Guichê
        </a>

    </div>

</div>
</body>
</html>
