<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Guichê - Chamada de Senhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<div class="container d-flex align-items-center justify-content-center py-5">

    <div class="card mx-auto text-center p-4 p-md-5 fade-in"
         style="max-width: 500px; width: 100%;">

        <h3>Painel do Guichê</h3>

        <p class="subtitle">
            Acompanhe as senhas chamadas
        </p>

        <div class="senha-display destaque-danger">
            <span class="section-title d-block">Senha chamada</span>

            <h1 id="senhaAtual" th:text="${currentDisplay}">
                0
            </h1>
        </div>

        <div class="text-start">

            <h4 class="section-title">
                Últimas chamadas
            </h4>

            <ul id="historico">
                <li th:each="senha : ${history}"
                    th:text="'Senha: ' + ${senha}">
                    Senha: 0
                </li>
            </ul>

        </div>

    </div>
</div>

<script th:inline="javascript">
    // Atualização automática via polling na API REST (/api/senha).
    // Resolve a limitação do Display.razor original, que era renderizado
    // apenas uma vez no servidor e não atualizava sozinho quando uma nova
    // senha era chamada em outra sessão.
    async function atualizarPainel() {
        try {
            const resp = await fetch('/api/senha');
            if (!resp.ok) return;
            const data = await resp.json();

            document.getElementById('senhaAtual').textContent = data.currentTicket;

            const lista = document.getElementById('historico');
            lista.innerHTML = '';
            data.history.slice().reverse().forEach(function (senha) {
                const li = document.createElement('li');
                li.textContent = 'Senha: ' + senha;
                lista.appendChild(li);
            });
        } catch (erro) {
            console.error('Erro ao atualizar painel:', erro);
        }
    }

    setInterval(atualizarPainel, 2000);
</script>

</body>
</html>
