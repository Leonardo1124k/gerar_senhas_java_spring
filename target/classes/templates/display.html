<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel do Guichê - Chamada de Senhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card mx-auto" style="max-width: 500px; padding: 20px; text-align: center;">
        <h3>Painel do Guichê - Chamada de Senhas</h3>

        <div style="font-size: 48px; font-weight: bold; color: darkred; margin: 20px;">
            <h1 id="senhaAtual" th:text="${currentDisplay}">0</h1>
        </div>

        <h4>Últimas chamadas:</h4>
        <ul id="historico" style="list-style: none; padding: 0;">
            <li th:each="senha : ${history}" th:text="'Senha: ' + ${senha}">Senha: 0</li>
        </ul>
    </div>
</div>

<script th:inline="javascript">
    // Atualização automática via polling na API REST (/api/senha).
    // Resolve a limitação do Display.razor original, que era renderizado
    // apenas uma vez no servidor e não atualizava sozinho quando uma nova
    // senha era chamada em outra sessão.
    async function atualizarPainel() {
        try {
            const resp = await fetch('/api/senha');
            if (!resp.ok) return;
            const data = await resp.json();

            document.getElementById('senhaAtual').textContent = data.currentTicket;

            const lista = document.getElementById('historico');
            lista.innerHTML = '';
            data.history.slice().reverse().forEach(function (senha) {
                const li = document.createElement('li');
                li.textContent = 'Senha: ' + senha;
                lista.appendChild(li);
            });
        } catch (erro) {
            console.error('Erro ao atualizar painel:', erro);
        }
    }

    setInterval(atualizarPainel, 2000);
</script>
</body>
</html>
